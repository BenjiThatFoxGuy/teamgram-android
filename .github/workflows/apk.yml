name: apk
on:
  push:
    branches: [hino]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - name: Native code for arm64 only (both our phones; 4x less to compile)
        run: sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
      # The SDK/NDK image is most of the build time; keep it in the Actions cache
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tg-build
          cache-from: type=gha,scope=tg-build
          cache-to: type=gha,scope=tg-build,mode=max
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/gradle-home
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build APK
        run: |
          mkdir -p ~/gradle-home && docker run --rm -v "$PWD":/home/source -v ~/gradle-home:/root/.gradle -e GRADLE_USER_HOME=/root/.gradle tg-build bash -c '
            cp -R /home/source/. /home/gradle && cd /home/gradle &&
            gradle --no-daemon :TMessagesProj_App:assembleAfatRelease &&
            mkdir -p /home/source/out && cp -R TMessagesProj_App/build/outputs/apk/. /home/source/out/'
      - uses: actions/upload-artifact@v4
        with:
          name: teamgram-hino-apk
          path: out/**/*.apk
