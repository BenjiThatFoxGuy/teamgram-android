name: apk
on:
  push:
    branches: [hino]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - name: Native code for arm64 only (both our phones; 4x less to compile)
        run: sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
      - name: Build image
        run: docker build -t tg-build .
      - name: Build APK
        run: |
          docker run --rm -v "$PWD":/home/source tg-build bash -c '
            cp -R /home/source/. /home/gradle && cd /home/gradle &&
            gradle --no-daemon :TMessagesProj_App:assembleAfatRelease &&
            mkdir -p /home/source/out && cp -R TMessagesProj_App/build/outputs/apk/. /home/source/out/'
      - uses: actions/upload-artifact@v4
        with:
          name: teamgram-hino-apk
          path: out/**/*.apk
